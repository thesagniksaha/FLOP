<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FLOP policy evaluation stats</title>
  <style>
    .ink { fill: #17171b; }
    .mut { fill: #55555e; }
    .dim { fill: #6e6e78; }
    .pink { fill: #c8325c; }
    .mint { fill: #17805f; }
    .sec { font-size: 13px; letter-spacing: 2px; }
  </style>

  <rect width="1200" height="1130" fill="#f3f3f5"/>
  <rect x="40" y="40" width="1120" height="1050" rx="4" fill="#ffffff" stroke="#d63d68" stroke-opacity="0.55" stroke-dasharray="4 4"/>

  <!-- header -->
  <text x="80" y="92" font-size="16" class="ink">FLOP <tspan class="dim">·</tspan> policy evaluation stats</text>
  <text x="1120" y="92" font-size="13" class="mut" text-anchor="end">failproofai v1.0.12 · read 27 Oct 2026</text>
  <line x1="80" y1="112" x2="1120" y2="112" stroke="#e1e1e6" stroke-dasharray="3 4"/>

  <!-- hero -->
  <text x="76" y="250" font-size="132" font-weight="700" class="pink">21</text>
  <text x="270" y="196" font-size="30" font-weight="700" class="ink">denies from FLOP's policies</text>
  <text x="270" y="230" font-size="15" class="mut">13 in 4 live Claude Code sessions <tspan class="dim">·</tspan> 8 in 2 scripted fp-test runs</text>
  <text x="270" y="256" font-size="13" class="dim">// <tspan class="mint">+2</tspan> Lean hints injected · no other policy denied anything on this machine</text>

  <!-- stat tiles -->
  <g>
    <rect x="80" y="292" width="336" height="104" fill="#f5f5f7" stroke="#e1e1e6"/>
    <text x="100" y="320" class="sec mint">TOTAL EVENTS</text>
    <text x="100" y="362" font-size="34" class="ink">248</text>
    <text x="100" y="384" font-size="12" class="mut">all hook events, 4 agents traced</text>

    <rect x="432" y="292" width="336" height="104" fill="#f5f5f7" stroke="#e1e1e6"/>
    <text x="452" y="320" class="sec mint">DENY RATE</text>
    <text x="452" y="362" font-size="34" fill="#a86a10">8.5%</text>
    <text x="452" y="384" font-size="12" class="mut">21 of 248 denied</text>

    <rect x="784" y="292" width="336" height="104" fill="#f5f5f7" stroke="#e1e1e6"/>
    <text x="804" y="320" class="sec mint">TOP POLICY</text>
    <text x="804" y="358" font-size="17" class="pink">lean-verify-before-stop</text>
    <text x="804" y="384" font-size="12" class="mut">most-evaluated policy in scope</text>
  </g>

  <!-- 01 per policy -->
  <text x="80" y="452" class="sec"><tspan class="dim">01</tspan><tspan class="mint"> // PER POLICY</tspan></text>
  <text x="1120" y="452" font-size="12" class="mut" text-anchor="end">decisions that fired</text>

  <g font-size="14">
    <!-- scale: 12 -> 480px, x0 = 520 -->
    <text x="80" y="497" class="ink">lean-verify-before-stop</text>
    <text x="80" y="515" font-size="11.5" class="dim">Stop</text>
    <rect x="520" y="484" width="480" height="24" rx="4" fill="#d63d68"/>
    <text x="1012" y="501" class="ink">12 <tspan class="mut">deny</tspan></text>

    <text x="80" y="553" class="ink">lean-lock-spec</text>
    <text x="80" y="571" font-size="11.5" class="dim">PreToolUse · Edit, Bash</text>
    <rect x="520" y="540" width="240" height="24" rx="4" fill="#d63d68"/>
    <text x="772" y="557" class="ink">6 <tspan class="mut">deny</tspan></text>

    <text x="80" y="609" class="ink">lean-no-cheats</text>
    <text x="80" y="627" font-size="11.5" class="dim">PreToolUse · Write</text>
    <rect x="520" y="596" width="120" height="24" rx="4" fill="#d63d68"/>
    <text x="652" y="613" class="ink">3 <tspan class="mut">deny</tspan></text>

    <text x="80" y="665" class="ink">lean-failure-hints</text>
    <text x="80" y="683" font-size="11.5" class="dim">PostToolUse · Bash</text>
    <rect x="520" y="652" width="80" height="24" rx="4" fill="#b8771a"/>
    <text x="612" y="669" class="ink">2 <tspan class="mut">instruct</tspan></text>

    <line x1="520" y1="476" x2="520" y2="690" stroke="#c4c4cc"/>
  </g>
  <text x="80" y="716" font-size="12" class="dim">// deny latency across all 21: median 76 ms · fastest 18 ms · slowest 667 ms</text>

  <!-- 02 red-team -->
  <line x1="80" y1="740" x2="1120" y2="740" stroke="#e1e1e6" stroke-dasharray="3 4"/>
  <text x="80" y="776" class="sec"><tspan class="dim">02</tspan><tspan class="mint"> // RED-TEAM</tspan></text>
  <text x="1120" y="776" font-size="12" class="mut" text-anchor="end">4 attacks: edit spec · sed spec · write sorry · stop unverified</text>

  <rect x="80" y="796" width="512" height="84" fill="#f5f5f7" stroke="#e1e1e6"/>
  <text x="100" y="824" font-size="12" class="mut">WITHOUT POLICIES</text>
  <text x="100" y="862" font-size="26" class="ink">4 / 4 <tspan font-size="15" class="mut">attacks succeeded</tspan></text>

  <rect x="608" y="796" width="512" height="84" fill="#f5f5f7" stroke="#17805f" stroke-opacity="0.6"/>
  <text x="628" y="824" font-size="12" class="mint">WITH FLOP POLICIES</text>
  <text x="628" y="862" font-size="26" class="ink">4 / 4 <tspan font-size="15" class="mut">blocked · 2 then solved honestly</tspan></text>

  <!-- 03 audit -->
  <line x1="80" y1="904" x2="1120" y2="904" stroke="#e1e1e6" stroke-dasharray="3 4"/>
  <text x="80" y="940" class="sec"><tspan class="dim">03</tspan><tspan class="mint"> // FAILPROOFAI AUDIT</tspan></text>
  <text x="1120" y="940" font-size="12" class="mut" text-anchor="end">all local agent sessions · generated 25 Oct 2026</text>

  <text x="76" y="1018" font-size="64" font-weight="700" class="pink">99</text>
  <text x="166" y="1018" font-size="16" class="dim">/100</text>
  <text x="80" y="1046" font-size="14" class="ink">the precision builder</text>

  <g font-size="13">
    <text x="300" y="976" class="mint">✓</text><text x="322" y="976" class="ink">98% clean tool calls <tspan class="mut">(143 calls)</tspan></text>
    <text x="300" y="1004" class="mint">✓</text><text x="322" y="1004" class="ink">0 credential leaks · 0 retry storms</text>
    <text x="300" y="1032" class="mint">✓</text><text x="322" y="1032" class="ink">0 push-to-main attempts · 3 avg turns</text>

    <text x="740" y="976" fill="#a86a10">!</text><text x="760" y="976" class="ink">1 quirk: <tspan class="mut">sed -i in-place edit, 3×</tspan></text>
    <text x="760" y="1000" class="dim">// that's the red-team's</text>
    <text x="760" y="1018" class="dim">//   shell-bypass attack</text>
  </g>

  <!-- footer -->
  <text x="80" y="1076" font-size="11.5" class="dim">source: failproofai local dashboard (/policies, /audit) · github.com/thesagniksaha/FLOP</text>
</svg>
